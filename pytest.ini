[pytest]
minversion = 7.0
testpaths =
    tests/selenium
    tests/security
    backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -v --strict-markers --tb=short
markers =
    selenium: Headless Chrome Selenium end-to-end functional UI tests
    security: Non-destructive OWASP Top 10 and application security verification tests
    smoke: Fast critical-path smoke tests
    slow: Longer-running end-to-end tests
log_cli = true
log_cli_level = INFO
