# =============================================================================
# Gitleaks Secret Detection Configuration for PhishGuard
# Extends the default Gitleaks ruleset to catch API keys, tokens, passwords,
# private keys, and cloud credentials while safely allowlisting non-secret files.
# =============================================================================
title = "PhishGuard Gitleaks Security Policy"

[extend]
useDefault = true

[allowlist]
description = "Allowlist template env files, synthetic test fixtures, and generated test reports"
paths = [
    '''^\.env\.example$''',
    '''^frontend/package-lock\.json$''',
    '''^reports/.*''',
    '''^screenshots/.*''',
    '''^backend/app/ml/artifacts/.*''',
]
regexes = [
    '''analyst@phishguard\.local''',
    '''qa\.analyst@phishguard\.local''',
]
