name: Vulnerability & Security Testing Pipeline

on:
  workflow_dispatch:
    inputs:
      zap_target_url:
        description: "Optional owned staging URL for non-destructive OWASP ZAP baseline scan (blank = local BioAge Pro)"
        required: false
        default: ""
      confirm_target_ownership:
        description: "Confirm you own or have explicit permission to scan zap_target_url"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret & Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p reports/security

      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Detection
        id: gitleaks
        run: |
          set +e
          gitleaks detect \
            --source . \
            --no-git \
            --config tests/security/gitleaks.toml \
            --report-format json \
            --report-path reports/security/gitleaks-report.json \
            --redact \
            --verbose
          EXIT_CODE=$?
          gitleaks detect \
            --source . \
            --no-git \
            --config tests/security/gitleaks.toml \
            --report-format sarif \
            --report-path reports/security/gitleaks-report.sarif \
            --redact \
            --exit-code 0
          exit $EXIT_CODE

      - name: Upload Gitleaks Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gitleaks-reports
          path: reports/security/gitleaks-report.*
          retention-days: 14
          if-no-files-found: warn

  javascript-sast-scan:
    name: JavaScript SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JavaScript SAST Scan & Generate Reports
        run: node tests/security/sast_check.js

      - name: Upload SAST Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sast-reports
          path: reports/security/sast-report.*
          retention-days: 14
          if-no-files-found: warn

  trivy-dependency-fs-scan:
    name: Trivy Dependency & Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: |
          mkdir -p reports/security
          chmod -R 777 reports/security

      - name: Pull Trivy Container Image
        id: trivy_img
        run: |
          if docker pull aquasec/trivy:latest; then
            echo "image=aquasec/trivy:latest" >> "$GITHUB_OUTPUT"
          elif docker pull public.ecr.aws/aquasecurity/trivy:latest; then
            echo "image=public.ecr.aws/aquasecurity/trivy:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/aquasecurity/trivy:latest" >> "$GITHUB_OUTPUT"
            docker pull ghcr.io/aquasecurity/trivy:latest
          fi

      - name: Run Trivy Filesystem & Dependency Scans (Table, JSON, SARIF)
        run: |
          IMG="${{ steps.trivy_img.outputs.image }}"
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMG" fs . \
            --scanners vuln,config,secret \
            --skip-dirs tests \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --format table \
            --output reports/security/trivy-report.txt \
            --exit-code 0

          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMG" fs . \
            --scanners vuln,config,secret \
            --skip-dirs tests \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --format json \
            --output reports/security/trivy-report.json \
            --exit-code 0

          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMG" fs . \
            --scanners vuln,config,secret \
            --skip-dirs tests \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output reports/security/trivy-results.sarif \
            --exit-code 0

          cat reports/security/trivy-report.txt

      - name: Enforce Trivy Critical Fixable Vulnerability Gate
        run: |
          IMG="${{ steps.trivy_img.outputs.image }}"
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMG" fs . \
            --scanners vuln,config,secret \
            --skip-dirs tests \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-trivy-reports
          path: |
            reports/security/trivy-report.txt
            reports/security/trivy-report.json
            reports/security/trivy-results.sarif
          retention-days: 14
          if-no-files-found: warn

  owasp-security-tests:
    name: OWASP Top 10 Security Control Tests (225 Cases + Excel)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORT: "3000"
      API_BASE_URL: "http://127.0.0.1:3000"
      SECURITY_EXCEL_REPORT: "reports/security/BioAge_Pro_Security_Test_Results.xlsx"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Prepare report directory
        run: mkdir -p reports/security

      - name: Start BioAge Pro Express Server
        run: |
          nohup node backend/server.js > reports/security/backend.log 2>&1 &
          echo $! > /tmp/bioage_sec_backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "BioAge Pro API ready for 225 OWASP security control tests."
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat reports/security/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Run 225 Non-Destructive OWASP Security Verification Cases (+ Excel Export)
        run: |
          pytest tests/security/test_security_controls.py \
            --html=reports/security/owasp-security-report.html \
            --self-contained-html \
            --junitxml=reports/security/owasp-security-junit.xml

      - name: Stop Express Server
        if: always()
        run: |
          if [ -f /tmp/bioage_sec_backend.pid ]; then
            kill "$(cat /tmp/bioage_sec_backend.pid)" 2>/dev/null || true
          fi

      - name: Upload OWASP Pytest & Excel Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-owasp-pytest-reports
          path: |
            reports/security/BioAge_Pro_Security_Test_Results.xlsx
            reports/security/owasp-security-report.html
            reports/security/owasp-security-junit.xml
          retention-days: 14
          if-no-files-found: warn

  owasp-zap-dast:
    name: OWASP ZAP Non-Destructive Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate safe target ownership policy
        id: zap_target
        run: |
          CUSTOM_URL="${{ github.event.inputs.zap_target_url }}"
          CONFIRMED="${{ github.event.inputs.confirm_target_ownership }}"
          if [ -n "$CUSTOM_URL" ]; then
            if [ "$CONFIRMED" != "true" ]; then
              echo "ERROR: Refusing to scan external URL without explicit ownership confirmation."
              exit 1
            fi
            echo "url=$CUSTOM_URL" >> "$GITHUB_OUTPUT"
            echo "local=false" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://127.0.0.1:3000/api/health" >> "$GITHUB_OUTPUT"
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 20
        if: steps.zap_target.outputs.local == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        if: steps.zap_target.outputs.local == 'true'
        run: npm ci

      - name: Prepare ZAP report directory
        run: |
          mkdir -p reports/security/zap
          chmod -R 777 reports/security/zap

      - name: Start owned local BioAge Pro Express application
        if: steps.zap_target.outputs.local == 'true'
        env:
          PORT: "3000"
        run: |
          nohup node backend/server.js > reports/security/zap/backend.log 2>&1 &
          echo $! > /tmp/bioage_zap_backend.pid

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Local BioAge Pro API ready for non-destructive OWASP ZAP baseline scan."
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat reports/security/zap/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Run OWASP ZAP Baseline Scan (Docker Host Network, Non-Destructive)
        id: zap_scan
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ steps.zap_target.outputs.url }}" \
            -c tests/security/zap-rules.tsv \
            -r reports/security/zap/zap-report.html \
            -J reports/security/zap/zap-report.json \
            -w reports/security/zap/zap-report.md \
            -x reports/security/zap/zap-report.xml \
            -I

      - name: Stop local Express server
        if: always()
        run: |
          if [ -f /tmp/bioage_zap_backend.pid ]; then
            kill "$(cat /tmp/bioage_zap_backend.pid)" 2>/dev/null || true
          fi

      - name: Upload OWASP ZAP Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-owasp-zap-reports
          path: reports/security/zap/
          retention-days: 14
          if-no-files-found: warn

  security-gate-summary:
    name: Security Pipeline Summary Gate
    runs-on: ubuntu-latest
    needs:
      - gitleaks-secret-scan
      - javascript-sast-scan
      - trivy-dependency-fs-scan
      - owasp-security-tests
      - owasp-zap-dast
    if: always()

    steps:
      - name: Publish Consolidated Security Summary
        run: |
          {
            echo "## BioAge Pro Security & Vulnerability Testing Summary"
            echo ""
            echo "| Security Stage | Tool | Result |"
            echo "| --- | --- | :---: |"
            echo "| Secret & Credential Detection | Gitleaks | \`${{ needs.gitleaks-secret-scan.result }}\` |"
            echo "| JavaScript Static Analysis (SAST) | JS SAST | \`${{ needs.javascript-sast-scan.result }}\` |"
            echo "| Dependency & Filesystem CVEs | Trivy | \`${{ needs.trivy-dependency-fs-scan.result }}\` |"
            echo "| OWASP Top 10 App Controls (225 Cases + Excel) | Pytest Security Suite | \`${{ needs.owasp-security-tests.result }}\` |"
            echo "| Web Application DAST (Baseline) | OWASP ZAP | \`${{ needs.owasp-zap-dast.result }}\` |"
            echo ""
            echo "- **Excel Workbook:** \`BioAge_Pro_Security_Test_Results.xlsx\` (inside \`security-owasp-pytest-reports\` artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "${{ needs.gitleaks-secret-scan.result }}" \
            "${{ needs.javascript-sast-scan.result }}" \
            "${{ needs.trivy-dependency-fs-scan.result }}" \
            "${{ needs.owasp-security-tests.result }}" \
            "${{ needs.owasp-zap-dast.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Security gate failed: one or more critical security stages did not succeed."
              exit 1
            fi
          done
