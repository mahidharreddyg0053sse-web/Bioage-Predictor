name: Selenium Functional UI Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional external application URL (leave blank to test local PhishGuard stack)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selenium-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-e2e:
    name: Headless Chrome Selenium Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      SELENIUM_HEADLESS: "true"
      SELENIUM_TIMEOUT: "20"
      APP_BASE_URL: ${{ github.event.inputs.app_url || 'http://127.0.0.1:5173' }}
      API_BASE_URL: "http://127.0.0.1:8000"
      RATE_LIMIT_REQUESTS_PER_MINUTE: "600"
      # Optional backend secrets (app falls back safely to SQLite / honest unavailable status when omitted)
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      URLHAUS_API_KEY: ${{ secrets.URLHAUS_API_KEY }}
      ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Google Chrome (Headless)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Ensure ML model artifact exists
        run: |
          if [ ! -f backend/app/ml/artifacts/phishguard_rf_model.joblib ]; then
            echo "Training Calibrated Random Forest model..."
            cd backend && python app/ml/train_model.py
          else
            echo "Pre-trained ML model found."
          fi

      - name: Prepare report and screenshot directories
        run: mkdir -p reports/selenium screenshots

      - name: Start PhishGuard Backend & Frontend servers
        if: ${{ github.event.inputs.app_url == '' }}
        run: |
          nohup bash -c 'cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000' \
            > reports/selenium/backend.log 2>&1 &
          echo $! > /tmp/phishguard_backend.pid

          nohup bash -c 'cd frontend && npm run dev -- --host 127.0.0.1 --port 5173' \
            > reports/selenium/frontend.log 2>&1 &
          echo $! > /tmp/phishguard_frontend.pid

          echo "Waiting for FastAPI backend on http://127.0.0.1:8000/api/health..."
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend is online."
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Backend failed to start within timeout:"
              cat reports/selenium/backend.log
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for Vite frontend on http://127.0.0.1:5173..."
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is online."
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Frontend failed to start within timeout:"
              cat reports/selenium/frontend.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Backend API Smoke Tests
        id: backend_tests
        run: |
          pytest backend/tests/test_api.py \
            --junitxml=reports/selenium/backend-junit.xml

      - name: Run Selenium Headless Chrome Test Suite
        id: selenium_tests
        run: |
          pytest tests/selenium \
            --html=reports/selenium/selenium-report.html \
            --self-contained-html \
            --junitxml=reports/selenium/selenium-junit.xml

      - name: Stop background servers
        if: always()
        run: |
          for pidfile in /tmp/phishguard_backend.pid /tmp/phishguard_frontend.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Publish Selenium Test Summary
        if: always()
        run: |
          {
            echo "## Selenium Automated Functional Testing Summary"
            echo ""
            echo "| Stage | Status |"
            echo "| --- | :---: |"
            echo "| Backend API Verification | \`${{ steps.backend_tests.outcome }}\` |"
            echo "| Headless Chrome Selenium Suite | \`${{ steps.selenium_tests.outcome }}\` |"
            echo ""
            SCREENSHOT_COUNT=$(find screenshots -maxdepth 1 -name '*.png' 2>/dev/null | wc -l)
            echo "- **Target URL:** \`${APP_BASE_URL}\`"
            echo "- **Failure Screenshots Captured:** ${SCREENSHOT_COUNT}"
            echo "- **Reports Artifact:** \`selenium-test-reports\` (contains \`selenium-report.html\` and JUnit XML)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Selenium Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: reports/selenium/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore
