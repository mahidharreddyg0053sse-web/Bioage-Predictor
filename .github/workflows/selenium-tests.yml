name: Selenium Functional UI Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional external application URL (leave blank to test local BioAge Pro stack)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selenium-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-e2e:
    name: Headless Chrome Selenium Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PORT: "3000"
      SELENIUM_HEADLESS: "true"
      SELENIUM_TIMEOUT: "20"
      APP_BASE_URL: ${{ github.event.inputs.app_url || 'http://127.0.0.1:3000' }}
      API_BASE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements.txt

      - name: Set up Google Chrome (Headless)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Prepare report and screenshot directories
        run: mkdir -p reports/selenium screenshots

      - name: Start BioAge Pro Server
        if: ${{ github.event.inputs.app_url == '' }}
        run: |
          nohup node backend/server.js > reports/selenium/backend.log 2>&1 &
          echo $! > /tmp/bioage_backend.pid

          echo "Waiting for BioAge Pro server on http://127.0.0.1:3000/api/health..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "BioAge Pro server is online."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within timeout:"
              cat reports/selenium/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Backend API Smoke Tests
        id: backend_tests
        run: |
          pytest tests/test_api.py \
            --junitxml=reports/selenium/backend-junit.xml

      - name: Run Selenium Headless Chrome Test Suite (228 Test Cases + Excel Export)
        id: selenium_tests
        env:
          SELENIUM_EXCEL_REPORT: "reports/selenium/BioAge_Pro_Selenium_Test_Results.xlsx"
        run: |
          pytest tests/selenium \
            --html=reports/selenium/selenium-report.html \
            --self-contained-html \
            --junitxml=reports/selenium/selenium-junit.xml

      - name: Stop background server
        if: always()
        run: |
          if [ -f /tmp/bioage_backend.pid ]; then
            kill "$(cat /tmp/bioage_backend.pid)" 2>/dev/null || true
          fi

      - name: Publish Selenium Test Summary
        if: always()
        run: |
          {
            echo "## BioAge Pro Selenium Automated Functional Testing Summary"
            echo ""
            echo "| Stage | Status |"
            echo "| --- | :---: |"
            echo "| Backend API Verification | \`${{ steps.backend_tests.outcome }}\` |"
            echo "| Headless Chrome Selenium Suite | \`${{ steps.selenium_tests.outcome }}\` |"
            echo ""
            SCREENSHOT_COUNT=$(find screenshots -maxdepth 1 -name '*.png' 2>/dev/null | wc -l)
            echo "- **Target URL:** \`${APP_BASE_URL}\`"
            echo "- **Failure Screenshots Captured:** ${SCREENSHOT_COUNT}"
            echo "- **Excel Workbook:** \`BioAge_Pro_Selenium_Test_Results.xlsx\` (inside \`selenium-test-reports\` artifact)"
            echo "- **Reports Artifact:** \`selenium-test-reports\` (contains Excel \`.xlsx\`, HTML, and JUnit XML)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Selenium Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: reports/selenium/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore
